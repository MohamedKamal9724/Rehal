<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="rihalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C16C"/>
      <stop offset="45%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9E782A"/>
    </linearGradient>
    <linearGradient id="rihalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9E782A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Luxury Geometric Emblem (Astrolabe & Desert Compass Star) -->
  <g transform="translate(14, 10)">
    <!-- Outer Decorative Ring -->
    <circle cx="50" cy="50" r="46" stroke="url(#rihalGold)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
    <circle cx="50" cy="50" r="42" stroke="url(#rihalGold)" stroke-width="2"/>
    <circle cx="50" cy="50" r="38" stroke="url(#rihalGold)" stroke-width="0.75" opacity="0.8"/>

    <!-- 8-Point Compass Star -->
    <path d="M50 12 L55 42 L88 50 L55 58 L50 88 L45 58 L12 50 L45 42 Z" fill="url(#rihalGold)" filter="url(#goldShadow)"/>
    <path d="M50 22 L54 44 L78 50 L54 56 L50 78 L46 56 L22 50 L46 44 Z" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Secondary Diagonal Rays -->
    <path d="M50 50 L72 28 M50 50 L72 72 M50 50 L28 72 M50 50 L28 28" stroke="url(#rihalGold)" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Inner Radiant Core -->
    <circle cx="50" cy="50" r="7" fill="url(#rihalGold)"/>
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Luxury Wordmark (English RIHAL & Arabic رِحال) -->
  <g transform="translate(130, 24)">
    <!-- English Wordmark -->
    <text x="0" y="44" font-family="'Playfair Display', 'Cinzel', 'Didot', 'Times New Roman', serif" font-size="46" font-weight="800" letter-spacing="7" fill="#0F172A">
      RIHAL
    </text>
    
    <!-- Arabic Calligraphic Companion -->
    <text x="216" y="42" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', serif" font-size="38" font-weight="700" fill="url(#rihalGold)">
      رِحال
    </text>

    <!-- Luxury Subtitle / Descriptor -->
    <text x="3" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#9E782A">
      LUXURY TRAVEL &amp; DMC COCKPIT
    </text>

    <!-- Decorative Accent Line -->
    <line x1="2" y1="80" x2="330" y2="80" stroke="url(#rihalGold)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="336" cy="80" r="2" fill="url(#rihalGold)"/>
  </g>
</svg>
